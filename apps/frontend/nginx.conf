# SPA do Nexa - serve estaticos e faz fallback de rota pro index.html.
# NAO faz proxy de /api nem /ws: quem roteia e o reverse proxy do HOST
# (frontend e backend sao origens separadas atras dele, no mesmo dominio).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # gzip basico p/ os estaticos
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # assets com hash no nome -> cache longo e imutavel
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: qualquer rota desconhecida cai no index.html (react-router)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
