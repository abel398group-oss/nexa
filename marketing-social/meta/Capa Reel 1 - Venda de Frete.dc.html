<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/hipertms-design-system-0aa56060-c159-4ada-8254-227b6ca7765a/tokens/colors.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0B0C0F; }
</style>
</helmet>

<div style="position:relative; width:1080px; height:1920px; background:#16181D; overflow:hidden; font-family:Inter,system-ui,sans-serif;">

  <!-- Actor photo — full-bleed background slot -->
  <div style="position:absolute; inset:0;">
    <x-import component-from-global-scope="image-slot" from="./image-slot.js" id="capa-reel1-ator" shape="rect" fit="cover" placeholder="Arraste aqui a foto/frame do ator" hint-size="1080px,1920px"></x-import>
  </div>

  <!-- Scrim: dark top + dark bottom so text reads over any photo -->
  <div style="position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg, rgba(22,24,29,0.94) 0%, rgba(22,24,29,0.55) 26%, rgba(22,24,29,0.12) 46%, rgba(22,24,29,0.55) 72%, rgba(22,24,29,0.97) 100%);"><div style="position: absolute; top: -252px; left: 10px; width: 820px; height: 820px; pointer-events: none; background: radial-gradient(circle, rgba(255,90,31,0.42) 0%, rgba(255,90,31,0.10) 42%, rgba(255,90,31,0) 70%)"></div></div>

  <!-- Orange ignition glow, top-left -->
  
  <!-- Navy glow, bottom-right -->
  <div style="position:absolute; bottom:-280px; right:-220px; width:900px; height:900px; pointer-events:none; background:radial-gradient(circle, rgba(30,58,95,0.55) 0%, rgba(30,58,95,0.12) 45%, rgba(30,58,95,0) 72%);"></div>

  <!-- ===== TOP: brand + eyebrow ===== -->
  <div style="position:absolute; top:96px; left:88px; right:88px; pointer-events:none;">
    <div style="display:flex; align-items:center; gap:16px;">
      <span style="font-size:44px; font-weight:900; letter-spacing:-0.03em; color:#FAFAF9;">Hiper<span style="color:#FF5A1F;">TMS</span></span>
      <span style="width:1px; height:34px; background:rgba(250,250,249,0.28);"></span>
      <span style="font-size:20px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:rgba(250,250,249,0.72);">Venda de frete</span>
    </div>
  </div>

  <!-- ===== BOTTOM: headline block ===== -->
  <div style="position:absolute; left:88px; right:88px; bottom:150px; pointer-events:none;">

    <!-- coverage pill -->
    <div style="display:inline-flex; align-items:center; gap:14px; background:rgba(255,90,31,0.14); border:1.5px solid rgba(255,90,31,0.55); backdrop-filter:blur(6px); padding:16px 26px; border-radius:999px; margin-bottom:34px;">
      <span style="width:12px; height:12px; border-radius:50%; background:#FF5A1F; box-shadow:0 0 16px 3px rgba(255,90,31,0.8);"></span>
      <span style="font-size:26px; font-weight:700; color:#FFD9C7; letter-spacing:0.02em;">+5.500 municípios · cobertura nacional</span>
    </div>

    <!-- headline -->
    <h1 style="margin:0; font-size:128px; line-height:0.96; font-weight:900; letter-spacing:-0.045em; color:#FAFAF9;">
      Cote o Brasil<br>inteiro <span style="color:#FF5A1F;">em segundos</span>.
    </h1>

    <!-- support line -->
    <p style="margin:34px 0 0; font-size:34px; line-height:1.4; font-weight:500; color:rgba(250,250,249,0.82); max-width:820px;">
      Sem montar tabela na mão. Escolheu origem e destino, o preço do frete e a sua margem já aparecem.
    </p>
  </div>

  <!-- corner accent bar -->
  <div style="position:absolute; left:0; bottom:0; width:100%; height:14px; background:linear-gradient(90deg, #FF5A1F 0%, #ED4708 50%, #1E3A5F 100%); pointer-events:none;"></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 540, &quot;height&quot;: 960}}"></script>
</body>
</html>
