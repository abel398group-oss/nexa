# Nexa — infra local (Sprint 1). Portas diferentes do MVP n8n para não conflitar.
services:
  postgres:
    image: pgvector/pgvector:pg16   # PostgreSQL 16 + pgvector (decisão Sprint 1)
    container_name: nexa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa_local_dev
      POSTGRES_DB: nexa
    ports:
      # 5434 externo (MVP usa 5432). Era 5433 até 22/08/2026 — subiu pra 5434 porque
      # outro projeto na mesma máquina (tiktok-shop) já tinha tomado a 5433 pra si.
      - "5434:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: nexa_redis
    restart: unless-stopped
    command: redis-server --requirepass nexa_redis_local_dev
    ports:
      - "6380:6379"   # 6380 externo (MVP usa 6379)
    volumes:
      - ./redisdata:/data

  waha:
    image: devlikeapro/waha:latest
    container_name: nexa_waha
    restart: unless-stopped
    environment:
      WAHA_API_KEY: Inicial398!
      WAHA_PRINT_QR: "true"         # imprime QR no log na 1ª vez
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
    ports:
      - "3018:3000"                 # backend local chama http://localhost:3018
    volumes:
      - ./waha-sessions:/app/.sessions  # persiste a sessão entre restarts

  # Segunda linha (vendas) para testar a divisão de números LOCALMENTE, antes de
  # subir. Pasta de sessão PRÓPRIA — duas instâncias na mesma pasta brigam pelos
  # arquivos de pareamento e derrubam os dois números.
  #
  # Pareie aqui um chip descartável, nunca o número real de vendas: ligar e
  # desligar a mesma conta em máquinas diferentes é padrão que o WhatsApp olha
  # com desconfiança, e o número que não se quer perder é justamente esse.
  #
  # Para ativar, no apps/backend/.env:
  #   WAHA_LINHAS=vendas
  #   WAHA_VENDAS_API_URL=http://localhost:3019
  #   WAHA_VENDAS_API_KEY=Inicial398!
  waha-vendas:
    image: devlikeapro/waha:latest
    container_name: nexa_waha_vendas
    restart: unless-stopped
    environment:
      WAHA_API_KEY: Inicial398!
      WAHA_PRINT_QR: "true"
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
    ports:
      - "3019:3000"                 # porta diferente da linha principal
    volumes:
      - ./waha-sessions-vendas:/app/.sessions

  backend:
    # Descomente para rodar o backend em container (opcional em dev local)
    # build: ./apps/backend
    # BUG-06 fix: TZ garante que new Date().getHours() retorne hora de Brasília
    # P7 fix: connection_limit=20 aumenta o pool padrão do Prisma (era 5)
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: "postgresql://nexa:nexa_local_dev@postgres:5432/nexa?schema=public&connection_limit=20&pool_timeout=10"
    profiles:
      - prod  # só sobe com: docker compose --profile prod up
