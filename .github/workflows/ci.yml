name: CI

on:
  # Roda em qualquer branch enviada (feedback imediato ao sincronizar pelo VS Code),
  # e em PRs mirando as branches principais.
  push:
    branches: ['**']
  pull_request:
    branches: [main, master, develop]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pnpm ANTES do Node, e a ordem não é estética: o setup-node lê o
      # `packageManager` do package.json e precisa encontrar o pnpm já no PATH.
      # Invertido, ele falha com "Unable to locate executable file: pnpm".
      - name: Setup pnpm
        # Sem `version:` de propósito. O v4 recusa quando a versão aparece nos dois
        # lugares (aqui e no `packageManager` do package.json) — e o package.json é a
        # fonte certa, porque é o mesmo valor que a máquina do dev usa.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma client PRIMEIRO: specs que importam PrismaService (ex.:
      # dev-watch.service.spec) precisam do client gerado — sem isso o teste
      # quebra com "Cannot find module '.prisma/client/default'" (CI 2026-07-25).
      # DIRECT_DATABASE_URL: o schema declara `directUrl`, e o Prisma exige que a
      # env EXISTA mesmo quando não vai conectar — `generate` e `validate` só
      # leem a string. Valor de mentira serve; o que não pode é faltar.
      - name: Generate Prisma client
        run: pnpm --filter backend exec prisma generate
        env:
          DATABASE_URL: "postgresql://nexa:nexa@localhost:5432/nexa?schema=public"
          DIRECT_DATABASE_URL: "postgresql://nexa:nexa@localhost:5432/nexa?schema=public"

      - name: Lint (backend)
        run: pnpm lint

      - name: Frontend typecheck
        run: pnpm --filter frontend typecheck

      - name: Backend tests
        run: pnpm --filter backend test

      - name: Frontend tests
        run: pnpm --filter frontend test

      - name: Build backend
        run: pnpm --filter backend build

      - name: Build frontend
        run: pnpm --filter frontend build

      - name: Validate Prisma schema
        run: pnpm --filter backend exec prisma validate
        env:
          DATABASE_URL: "postgresql://nexa:nexa@localhost:5432/nexa?schema=public"
          DIRECT_DATABASE_URL: "postgresql://nexa:nexa@localhost:5432/nexa?schema=public"
