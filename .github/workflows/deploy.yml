# ============================================================
# CD - Deploy automatico para Producao (Droplet DigitalOcean)
# ============================================================
# Roda no push para master. Builda as imagens, publica no DockerHub,
# e faz deploy via SSH no droplet (pull + up + healthcheck).
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, DROPLET_IP, DROPLET_SSH_KEY,
# DROPLET_SSH_PASSPHRASE (opcional).
# ============================================================

name: Deploy Nexa (Production)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-nexa-production
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nexa-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nexa-frontend

jobs:
  build-and-push:
    name: Build and Push Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Sem `version:` — a versão vem do `packageManager` do package.json. O v4 falha
      # se ela estiver nos dois lugares.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Tag short SHA
        id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      # As duas envs só precisam EXISTIR: `prisma generate` lê a string do
      # datasource e não conecta. O schema declara `directUrl`, e sem a variável
      # o generate falha — derrubando o build inteiro. Ver CLAUDE.md (P1002).
      - name: Build backend
        run: pnpm --filter backend exec prisma generate && pnpm --filter backend build
        env:
          DATABASE_URL: "postgresql://nexa:nexa@localhost:5432/nexa?schema=public"
          DIRECT_DATABASE_URL: "postgresql://nexa:nexa@localhost:5432/nexa?schema=public"
      - name: Verificar build backend
        run: test -f apps/backend/dist/main.js
      - name: Build frontend
        run: pnpm --filter frontend build
      - name: Verificar build frontend
        run: test -f apps/frontend/dist/index.html
      - name: Login no DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/backend/Dockerfile.production
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=nexa-backend
          cache-to: type=gha,mode=max,scope=nexa-backend
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=nexa-frontend
          cache-to: type=gha,mode=max,scope=nexa-frontend

  deploy:
    name: Deploy no Droplet
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v5
      - name: Sincronizar compose no droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          source: "docker-compose.production.yml"
          target: "~/nexa/"
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          command_timeout: 15m
          script: |
            set -e
            cd /root/nexa

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            # ── helpers ────────────────────────────────────────────────
            wait_healthy() {
              local SERVICE=$1 URL=$2 MAX=${3:-7} INTERVAL=${4:-12}
              for i in $(seq 1 $MAX); do
                echo "  [$SERVICE] tentativa $i/$MAX..."
                sleep $INTERVAL
                local STATUS
                STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
                if [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ] || [ "$STATUS" = "304" ]; then
                  echo "  [$SERVICE] saudavel — HTTP $STATUS"
                  return 0
                fi
                echo "  [$SERVICE] HTTP $STATUS — aguardando..."
              done
              echo "  [$SERVICE] FALHA apos $MAX tentativas"
              return 1
            }

            rollback_service() {
              local SERVICE=$1 PREV_TAG=$2
              echo "  Rollback $SERVICE -> $PREV_TAG"
              if [ "$PREV_TAG" != "none" ]; then
                docker tag "$PREV_TAG" "$DOCKERHUB_USERNAME/nexa-${SERVICE}:latest" 2>/dev/null || true
              fi
              docker compose -f docker-compose.production.yml up -d --no-deps --force-recreate "$SERVICE" || true
              echo "  Rollback $SERVICE concluido."
            }
            # ──────────────────────────────────────────────────────────

            echo "[1/5] Salvando estado atual para rollback..."
            PREV_BACKEND_IMG=$(docker inspect --format='{{.Image}}' $(docker compose -f docker-compose.production.yml ps -q backend 2>/dev/null) 2>/dev/null || echo "none")
            PREV_FRONTEND_IMG=$(docker inspect --format='{{.Image}}' $(docker compose -f docker-compose.production.yml ps -q frontend 2>/dev/null) 2>/dev/null || echo "none")
            echo "  Backend anterior: $PREV_BACKEND_IMG"
            echo "  Frontend anterior: $PREV_FRONTEND_IMG"

            echo "[2/5] Baixando novas imagens..."
            docker compose -f docker-compose.production.yml pull

            echo "[3/5] Rolling deploy — backend..."
            docker compose -f docker-compose.production.yml up -d --no-deps --force-recreate backend

            echo "[4/5] Health check backend (7 x 12s)..."
            if ! wait_healthy "backend" "http://localhost:3001/api/health" 7 12; then
              echo "FALHA: backend nao ficou saudavel!"
              docker compose -f docker-compose.production.yml logs --tail=60 backend
              echo "Iniciando rollback do backend..."
              rollback_service "backend" "$PREV_BACKEND_IMG"
              exit 1
            fi

            echo "[4b/5] Rolling deploy — frontend..."
            docker compose -f docker-compose.production.yml up -d --no-deps --force-recreate frontend

            echo "[4c/5] Health check frontend (5 x 8s)..."
            if ! wait_healthy "frontend" "http://localhost:8081/" 5 8; then
              echo "FALHA: frontend nao ficou saudavel!"
              docker compose -f docker-compose.production.yml logs --tail=60 frontend
              echo "Iniciando rollback do frontend..."
              rollback_service "frontend" "$PREV_FRONTEND_IMG"
              exit 1
            fi

            echo "[5/5] Limpando imagens antigas (mantendo 3 mais recentes)..."
            for REPO in "$DOCKERHUB_USERNAME/nexa-backend" "$DOCKERHUB_USERNAME/nexa-frontend"; do
              IDS=$(docker images "$REPO" --format '{{.ID}}' | awk '!seen[$0]++')
              KEEP=$(echo "$IDS" | head -n 3)
              IN_USE=$(docker ps -q | xargs -r docker inspect --format '{{.Image}}' | sort -u)
              for ID in $IDS; do
                if echo "$KEEP" | grep -q "$ID"; then continue; fi
                if echo "$IN_USE" | grep -q "$ID"; then continue; fi
                docker rmi -f "$ID" >/dev/null 2>&1 && echo "  removido $REPO ($ID)" || true
              done
            done
            docker image prune -f >/dev/null 2>&1 || true

            docker compose -f docker-compose.production.yml ps
            echo "Deploy concluido com sucesso!"
