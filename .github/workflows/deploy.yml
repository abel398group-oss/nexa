# ============================================================
# CD - Deploy automatico para Producao (Droplet DigitalOcean)
# ============================================================
# Roda no push para master. Builda as imagens, publica no DockerHub,
# e faz deploy via SSH no droplet (pull + up + healthcheck).
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, DROPLET_IP, DROPLET_SSH_KEY,
# DROPLET_SSH_PASSPHRASE (opcional).
# ============================================================

name: Deploy Nexa (Production)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-nexa-production
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nexa-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nexa-frontend

jobs:
  build-and-push:
    name: Build and Push Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Tag short SHA
        id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Build backend
        run: pnpm --filter backend exec prisma generate && pnpm --filter backend build
      - name: Verificar build backend
        run: test -f apps/backend/dist/main.js
      - name: Build frontend
        run: pnpm --filter frontend build
      - name: Verificar build frontend
        run: test -f apps/frontend/dist/index.html
      - name: Login no DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/backend/Dockerfile.production
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=nexa-backend
          cache-to: type=gha,mode=max,scope=nexa-backend
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=nexa-frontend
          cache-to: type=gha,mode=max,scope=nexa-frontend

  deploy:
    name: Deploy no Droplet
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizar compose no droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          source: "docker-compose.production.yml"
          target: "~/nexa/"
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          command_timeout: 15m
          script: |
            set -e
            cd ~/nexa
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker compose -f docker-compose.production.yml pull
            docker compose -f docker-compose.production.yml up -d
            OK=false
            for i in 1 2 3 4 5 6 7; do
              sleep 12
              CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/health || echo 000)
              if [ "$CODE" = "200" ]; then OK=true; echo "backend healthy"; break; fi
              echo "tentativa $i de 7 backend HTTP $CODE"
            done
            if [ "$OK" != "true" ]; then
              echo "FALHA no health check"
              docker compose -f docker-compose.production.yml logs --tail=50 backend
              exit 1
            fi
            docker image prune -f >/dev/null 2>&1 || true
            docker compose -f docker-compose.production.yml ps
            echo "Deploy concluido"
